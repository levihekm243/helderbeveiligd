<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelderBeveiligd Cockpit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --surface-hover: #FAFAF9;
    --track: #EEF0F1;
    --border: #E4E7E9;
    --border-strong: #D7DBDE;
    --ink: #14181F;
    --slate: #5B6472;
    --slate-soft: #8891A0;
    --navy: #131C2E;
    --navy-line: #26314A;
    --navy-text: #C7CCD6;
    --navy-text-dim: #8991A0;
    --navy-active: #1F2A40;
    --seal: #B4802E;
    --seal-ink: #8A611F;
    --seal-soft: #F4E9D8;
    --seal-soft-border: #E8D4AC;
    --critical: #C4432E;
    --high: #DE8A2E;
    --medium: #C9A227;
    --good: #2E7D5B;
    --shadow: 0 1px 2px rgba(20,24,31,0.05);
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131A;
      --surface: #171B24;
      --surface-hover: #1D222C;
      --track: #232833;
      --border: #262B36;
      --border-strong: #333947;
      --ink: #ECEEF2;
      --slate: #9CA3B0;
      --slate-soft: #7A8291;
      --navy: #0B0E16;
      --navy-line: #232A3B;
      --navy-text: #C7CCD6;
      --navy-text-dim: #7A8291;
      --navy-active: #1B2233;
      --seal: #D3A054;
      --seal-ink: #E8C079;
      --seal-soft: #241F12;
      --seal-soft-border: #443722;
      --critical: #E2604A;
      --high: #F0A048;
      --medium: #E0C24C;
      --good: #45B084;
      --shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131A;
    --surface: #171B24;
    --surface-hover: #1D222C;
    --track: #232833;
    --border: #262B36;
    --border-strong: #333947;
    --ink: #ECEEF2;
    --slate: #9CA3B0;
    --slate-soft: #7A8291;
    --navy: #0B0E16;
    --navy-line: #232A3B;
    --navy-text: #C7CCD6;
    --navy-text-dim: #7A8291;
    --navy-active: #1B2233;
    --seal: #D3A054;
    --seal-ink: #E8C079;
    --seal-soft: #241F12;
    --seal-soft-border: #443722;
    --critical: #E2604A;
    --high: #F0A048;
    --medium: #E0C24C;
    --good: #45B084;
    --shadow: 0 1px 2px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  ::selection { background: var(--seal-soft); color: var(--ink); }
  button {
    font-family: inherit; font-size: inherit; color: inherit; cursor: pointer;
    appearance: none; -webkit-appearance: none; background: none; border: none; margin: 0; padding: 0;
  }
  input { font-family: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--seal); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 224px; flex-shrink: 0; background: var(--navy); color: var(--navy-text);
    padding: 20px 12px; display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; margin-bottom: 26px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--seal);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-mark span { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: var(--navy); }
  .brand-name { color: #fff; font-weight: 600; font-size: 14px; letter-spacing: -0.1px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px;
    font-size: 13.5px; cursor: pointer; color: var(--navy-text-dim); background: transparent;
    border: none; text-align: left; width: 100%; transition: background .12s, color .12s;
  }
  .nav-item:hover { color: var(--navy-text); }
  .nav-item.active { color: #fff; background: var(--navy-active); }
  .nav-item svg { flex-shrink: 0; }
  .sidebar-footer {
    margin-top: auto; padding: 10px; border-radius: 8px; background: var(--navy-active);
    font-size: 12px; color: var(--navy-text-dim); line-height: 1.5;
  }
  .sidebar-footer strong { color: var(--navy-text); font-weight: 600; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 22px 32px 60px; overflow-y: auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
  .topbar .org { font-size: 12px; color: var(--slate); }
  .topbar h1 { font-size: 20px; font-weight: 600; margin: 2px 0 0; letter-spacing: -0.2px; text-wrap: balance; }
  .topbar-icons { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .topbar-icons svg { color: var(--slate); cursor: pointer; }
  .avatar { width: 30px; height: 30px; border-radius: 99px; background: var(--border); flex-shrink: 0; }

  /* ---------- Card ---------- */
  .card {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .card.clickable { cursor: pointer; transition: border-color .15s, transform .1s; }
  .card.clickable:hover { border-color: var(--seal); }
  .card.clickable:active { transform: translateY(1px); }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .card-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--slate);
  }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--slate);
    margin-bottom: 6px; display: block;
  }
  .more-link {
    margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink);
    display: inline-flex; align-items: center; gap: 2px; cursor: pointer; background: none; border: none; padding: 0;
    font-family: inherit;
  }
  .more-link:hover { color: var(--seal); }

  /* ---------- Pills / dots ---------- */
  .pill {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; letter-spacing: 0.2px;
    display: inline-block; white-space: nowrap;
  }
  .pill-critical { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .pill-high { background: color-mix(in srgb, var(--high) 15%, transparent); color: var(--high); }
  .pill-medium { background: color-mix(in srgb, var(--medium) 15%, transparent); color: var(--medium); }
  .pill-good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .pill-navy { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
  .status-dot { display: inline-flex; align-items: center; gap: 8px; }
  .status-dot .dot { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; }
  .status-dot .dot-ok { background: var(--good); }
  .status-dot .dot-partial { background: var(--high); }
  .status-dot .dot-missing { background: var(--critical); }
  .status-dot span.txt { font-size: 13px; color: var(--slate); }
  .risk-dot { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; }
  .risk-dot.critical { background: var(--critical); }
  .risk-dot.high { background: var(--high); }
  .risk-dot.medium { background: var(--medium); }
  .risk-dot.low { background: var(--good); }

  /* ---------- Overview ---------- */
  .grid-overview { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; }
  .span-3 { grid-column: span 3; }
  .span-2 { grid-column: span 2; }
  .hero { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .ring-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
  .ring-wrap .ring-value { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-wrap .ring-value b { font-size: 26px; font-weight: 600; line-height: 1; }
  .ring-wrap .ring-value small { font-size: 9px; color: var(--slate); letter-spacing: 0.4px; }
  .hero-mid { flex: 1; min-width: 240px; }
  .hero-status { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hero-status .word { font-size: 15px; font-weight: 600; }
  .hero-status .delta { font-size: 13px; color: var(--good); display: inline-flex; align-items: center; gap: 2px; }
  .subscores { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .subscore { flex: 1; min-width: 70px; }
  .subscore .sname { font-size: 11px; color: var(--slate); margin-bottom: 4px; }
  .bar-track { height: 5px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .nba {
    border-left: 1px solid var(--border); padding-left: 24px; width: 240px; flex-shrink: 0;
  }
  @media (max-width: 900px) { .nba { border-left: none; border-top: 1px solid var(--border); padding: 16px 0 0; width: 100%; } }
  .nba .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--seal); margin-bottom: 8px; }
  .nba .title { font-weight: 600; margin-bottom: 6px; }
  .nba .meta { font-size: 12px; color: var(--slate); margin-bottom: 12px; }
  .btn-primary {
    background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 9px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s;
  }
  .btn-primary:hover { background: color-mix(in srgb, var(--navy) 85%, var(--seal) 15%); }
  .stat-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat-num { font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 12px; color: var(--slate); margin-top: 4px; }
  .fw-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .fw-row .fname { font-size: 13px; width: 82px; flex-shrink: 0; }
  .fw-row .bar-track { flex: 1; }
  .fw-row .fpct { font-size: 12px; width: 34px; text-align: right; flex-shrink: 0; }
  .insight-card { background: var(--seal-soft); border: 1px solid var(--seal-soft-border); }
  .insight-body { display: flex; gap: 12px; }
  .insight-body p { margin: 0; font-size: 14px; line-height: 1.55; }

  @media (max-width: 900px) {
    .grid-overview { grid-template-columns: 1fr; }
    .span-3, .span-2 { grid-column: 1 / -1; }
  }

  /* ---------- Compliance ---------- */
  .fw-tabs { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .fw-tab { flex: 1; min-width: 180px; }
  .fw-tab .pct { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .fw-tab .name { font-weight: 600; margin-bottom: 6px; }
  .fw-tab .bar-track { margin-bottom: 8px; height: 6px; }
  .fw-tab .breakdown { font-size: 12px; color: var(--slate); }
  .req-row {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; width: 100%;
    border-bottom: 1px solid var(--border); gap: 16px;
  }
  .req-row:last-child { border-bottom: none; }
  .req-row.clickable { cursor: pointer; }
  .req-row.clickable:hover { color: var(--seal); }
  .req-row .rtitle { font-size: 13.5px; }
  .req-meta { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
  .detail-eyebrow { font-size: 12px; color: var(--slate); margin-bottom: 4px; }
  .detail-title { font-weight: 600; font-size: 16px; max-width: 560px; text-wrap: balance; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--slate); padding: 4px; border-radius: 6px; }
  .icon-btn:hover { color: var(--ink); background: var(--surface-hover); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 760px) { .detail-grid { grid-template-columns: 1fr; } }
  .evidence-chip {
    font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; display: inline-block;
  }
  .prose { font-size: 13px; color: var(--ink); opacity: 0.85; line-height: 1.6; }
  .missing-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.9; opacity: 0.85; }

  /* ---------- Risks ---------- */
  .risks-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .risks-grid.with-detail { grid-template-columns: 1fr 380px; }
  @media (max-width: 900px) { .risks-grid.with-detail { grid-template-columns: 1fr; } }
  .risk-counts { display: flex; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
  .risk-count-num { font-size: 22px; font-weight: 600; line-height: 1; }
  .risk-row {
    display: flex; align-items: center; justify-content: space-between; padding: 13px 4px; width: 100%;
    border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 6px;
  }
  .risk-row:last-child { border-bottom: none; }
  .risk-row:hover { color: var(--seal); }
  .risk-row.selected { background: var(--surface-hover); }
  .risk-row-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .risk-row-main .rtitle { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .risk-row-meta { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .risk-stats { display: flex; gap: 24px; margin: 14px 0 16px; flex-wrap: wrap; }
  .risk-stats .val { font-size: 20px; font-weight: 600; }
  .fw-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }

  /* ---------- Documents ---------- */
  .doc-stats { display: flex; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
  .doc-stats .n { font-size: 22px; font-weight: 600; }
  .doc-stats .l { font-size: 12px; color: var(--slate); margin-left: 4px; }
  .doc-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--border); gap: 16px; }
  .doc-row:last-child { border-bottom: none; }
  .doc-row .dname { font-size: 13.5px; }
  .doc-row .doc-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .doc-action { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 2px; }
  .doc-action:hover { color: var(--seal); }

  /* ---------- Actions ---------- */
  .action-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--border); gap: 16px; }
  .action-row:last-child { border-bottom: none; }
  .action-row.done .atitle { text-decoration: line-through; opacity: 0.5; }
  .action-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .check-btn {
    width: 20px; height: 20px; border-radius: 99px; border: 1.5px solid var(--border-strong); background: var(--surface);
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: transparent; padding: 0;
  }
  .check-btn:hover { border-color: var(--good); }
  .action-row.done .check-btn { background: var(--good); border-color: var(--good); color: #fff; }
  .atitle { font-size: 13.5px; font-weight: 500; }
  .ameta { font-size: 12px; color: var(--slate); margin-top: 2px; }
  .ameta.overdue { color: var(--critical); }

  /* ---------- AI Assistant ---------- */
  .ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--seal); }
  .ai-head span { font-weight: 600; font-size: 13px; color: var(--ink); }
  .chat-thread { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .bubble { max-width: 78%; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; line-height: 1.5; }
  .bubble.user { align-self: flex-end; background: var(--navy); color: #fff; }
  .bubble.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .chat-form { display: flex; gap: 8px; }
  .chat-form input {
    flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px;
    background: var(--surface); color: var(--ink); outline: none;
  }
  .chat-form input:focus { border-color: var(--seal); }

  /* ---------- Placeholder ---------- */
  .placeholder { padding: 40px 0; text-align: center; color: var(--slate); }
  .placeholder svg { margin-bottom: 10px; opacity: 0.5; }
  .placeholder p { font-size: 13.5px; margin: 0; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--navy); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    z-index: 50; display: flex; align-items: center; gap: 8px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Responsive sidebar ---------- */
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 12px; gap: 16px; }
    .brand { margin-bottom: 0; }
    .nav { flex-direction: row; overflow-x: auto; gap: 2px; flex: 1; }
    .nav-item span { display: none; }
    .nav-item { padding: 8px; }
    .sidebar-footer { display: none; }
    .main { padding: 18px 16px 40px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span>H</span></div>
      <span class="brand-name">HelderBeveiligd</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">Fase 1 · Bollenstreek pilot<br><strong>Acme Bloembollen B.V.</strong></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="org">Acme Bloembollen B.V.</div>
        <h1 id="view-title">Overview</h1>
      </div>
      <div class="topbar-icons">
        <span id="icon-search" aria-hidden="true"></span>
        <span id="icon-bell" aria-hidden="true"></span>
        <div class="avatar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="view-root"></div>
  </main>
</div>

<div id="toast"></div>

          '<div class="action-main">' +
            '<button class="check-btn" data-toggle-action="' + i + '">' + icon("checkCircle", 13) + '</button>' +
            '<span class="' + riskPillClass(a.priority === "high" ? "critical" : "medium") + ' pill">' + (a.priority === "high" ? "High" : "Medium") + '</span>' +
            '<div><div class="atitle">' + esc(a.title) + '</div>' +
            '<div class="ameta' + (a.overdue && !a.done ? ' overdue' : '') + '">Due ' + a.due + (a.overdue ? " · overdue" : "") + ' · ' + esc(a.framework) + ' · effort ' + esc(a.effort) + '</div></div>' +
          '</div>' + icon("chevronRight", 14) +
        '</div>';
      }).join("") +
    '</div>';
    return html;
  }

  function viewAi() {
    var html = '<div class="card">' +
      '<div class="ai-head">' + icon("sparkles", 16) + '<span>AI Assistant — antwoordt uitsluitend op basis van jouw organisatiedata</span></div>' +
      '<div class="chat-thread" id="chat-thread">' +
        aiThread.map(function (m) { return '<div class="bubble ' + m.role + '">' + esc(m.text) + '</div>'; }).join("") +
      '</div>' +
      '<form class="chat-form" id="chat-form">' +
        '<input type="text" id="chat-input" placeholder="Stel een vraag over je compliance-status..." autocomplete="off">' +
        '<button class="btn-primary" type="submit">Verstuur</button>' +
      '</form>' +
    '</div>';
    return html;
  }

  function viewPlaceholder(label) {
    return '<div class="card"><div class="placeholder">' + icon("fileBarChart", 28, 1.5) + '<p>' + esc(label) + ' volgt in een latere release van deze prototype.</p></div></div>';
  }

  var VIEWS = {
    overview: viewOverview, compliance: viewCompliance, risks: viewRisks,
    documents: viewDocuments, actions: viewActions, ai: viewAi,
    reports: function () { return viewPlaceholder("One-click compliance exports (PDF)"); },
    settings: function () { return viewPlaceholder("Organisatie- en gebruikersinstellingen"); }
  };

  /* ============================== RENDER ============================== */
  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = NAV.map(function (n) {
      var active = state.view === n.id;
      return '<button type="button" class="nav-item' + (active ? ' active' : '') + '" data-nav="' + n.id + '" aria-label="' + esc(n.label) + '"' + (active ? ' aria-current="page"' : '') + '>' + icon(n.icon, 15) + '<span aria-hidden="true">' + n.label + '</span></button>';
    }).join("");
  }

  function render() {
    renderNav();
    document.getElementById("view-title").textContent = VIEW_LABELS[state.view];
    document.getElementById("view-root").innerHTML = VIEWS[state.view]();
    if (state.view === "ai") {
      var thread = document.getElementById("chat-thread");
      thread.scrollTop = thread.scrollHeight;
      var form = document.getElementById("chat-form");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var input = document.getElementById("chat-input");
        var val = input.value.trim();
        if (!val) return;
        aiThread.push({ role: "user", text: val });
        aiThread.push({ role: "ai", text: aiReplyFor(val) });
        input.value = "";
        render();
        document.getElementById("chat-input").focus();
      });
    }
  }

  /* ============================== EVENTS ============================== */
  document.getElementById("icon-search").innerHTML = icon("search", 16);
  document.getElementById("icon-bell").innerHTML = icon("bell", 16);

  document.addEventListener("click", function (e) {
    var navBtn = e.target.closest("[data-nav]");
    if (navBtn) { state.view = navBtn.getAttribute("data-nav"); render(); return; }

    var gotoBtn = e.target.closest("[data-goto]");
    if (gotoBtn) { state.view = gotoBtn.getAttribute("data-goto"); render(); return; }

    var fwBtn = e.target.closest("[data-framework]");
    if (fwBtn) { state.framework = fwBtn.getAttribute("data-framework"); state.requirement = null; render(); return; }

    var reqBtn = e.target.closest("[data-requirement]");
    if (reqBtn) { state.requirement = reqBtn.getAttribute("data-requirement"); render(); return; }

    var closeReq = e.target.closest("[data-close-requirement]");
    if (closeReq) { state.requirement = null; render(); return; }

    var riskBtn = e.target.closest("[data-risk]");
    if (riskBtn) { state.risk = parseInt(riskBtn.getAttribute("data-risk"), 10); render(); return; }

    var closeRisk = e.target.closest("[data-close-risk]");
    if (closeRisk) { state.risk = null; render(); return; }

    var toggleAction = e.target.closest("[data-toggle-action]");
    if (toggleAction) {
      var idx = parseInt(toggleAction.getAttribute("data-toggle-action"), 10);
      DATA.actions[idx].done = !DATA.actions[idx].done;
      render();
      return;
    }

    var toastBtn = e.target.closest("[data-toast]");
    if (toastBtn) { toast(toastBtn.getAttribute("data-toast")); return; }
  });

  render();
})();
</script>
</body>
</html>
